[project]
name = "vulntriage-rag"
version = "0.1.0"
description = "Exploit-aware dependency vulnerability triage with hybrid RAG"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "packaging>=24.1",
    "cvss>=3.1",
    "ollama>=0.3",
    "google-genai>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "respx>=0.21", "pytest-asyncio>=0.24"]

[project.scripts]
vt = "vt.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vt"]
